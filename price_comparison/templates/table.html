<section class="table-responsive mt-4">
    <table class="table align-middle comparison-table table-provider">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col" class="sortable" tabindex="0" data-col="1" data-best="min">Price</th>
                <th scope="col" class="sortable" tabindex="0" data-col="2" data-best="max">GB</th>
                <th scope="col" class="sortable" tabindex="0" data-col="3" data-best="max">Minutes</th>
                <th scope="col" class="sortable" tabindex="0" data-col="4" data-best="max">SMS</th>
                <th scope="col" class="sortable" tabindex="0" data-col="5" data-best="max">Units</th>
                <th scope="col" class="sortable" tabindex="0" data-col="6" data-best="min">1 GB</th>
                <th scope="col" class="sortable" tabindex="0" data-col="7" data-best="min">60 min</th>
                <th scope="col" class="sortable" tabindex="0" data-col="8" data-best="min">1000 Units</th>
            </tr>
        </thead>
        <tbody>
        {% for row in rows %}
            <tr>
                <td>{{ row['name'] }}</td>
                <td>{{ row['price'] }}</td>
                <td>{{ row['gb'] }}</td>
                <td>{{ row['minutes'] }}</td>
                <td>{{ row['sms'] }}</td>
                <td>{{ row['units'] }}</td>
                <td>{{ row['one_gb_price'] }}</td>
                <td>{{ row['sixty_min_price'] }}</td>
                <td>{{ row['thousand_units'] }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</section>
