<header class="app-header">

    <div class="brand">
        <a href="{{ url_for('home') }}" class="brand-link">
            <span class="brand-white">Provider</span>
            <span class="brand-blue">Comparison</span>
        </a>
    </div>

    <ul class="nav header-nav">
        <li class="nav-item">
            <a href="{{ url_for('home') }}"
               class="nav-link {% if active_page == 'home' %}active{% endif %}">
                Home
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('a1') }}"
               class="nav-link {% if active_page == 'a1' %}active{% endif %}">
                A1
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('bon_bon') }}"
               class="nav-link {% if active_page == 'bon_bon' %}active{% endif %}">
                Bon-Bon
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('tcom') }}"
               class="nav-link {% if active_page == 'tcom' %}active{% endif %}">
                T-Com
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('telemach') }}"
               class="nav-link {% if active_page == 'telemach' %}active{% endif %}">
                Telemach
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('tomato') }}"
               class="nav-link {% if active_page == 'tomato' %}active{% endif %}">
                Tomato
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('compare') }}"
               class="nav-link {% if active_page == 'compare' %}active{% endif %}">
                Compare
            </a>
        </li>

        <li class="nav-item">
            <a href="{{ url_for('api') }}"
               class="nav-link {% if active_page == 'API' %}active{% endif %}">
                API
            </a>
        </li>
    </ul>

        <div class="header-auth">
            {% if not logged_in %}
                <a href="{{ url_for('login') }}" class="auth-btn">Login</a>
                <a href="{{ url_for('register') }}" class="auth-btn primary">Register</a>
            {% else %}
                <a href="{{ url_for('profile') }}" class="auth-btn">Profile</a>
                <form action="{{ url_for('logout_post') }}" method="POST">
                    <button type="submit" class="auth-btn primary">
                        Logout
                    </button>
                </form>
            {% endif %}
        </div>


</header>
