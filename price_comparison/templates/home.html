<!DOCTYPE html>
<html lang="en">
<head>
    <title>Compare</title>
    {% include 'head.html' %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- PAGE CONTENT -->
    <main class="container py-4 flex-grow-1">

        <!-- NAVIGATION -->
        {% include 'header.html'%}


        <!-- PROVIDER CARDS -->
        <div class="providers-wrapper rounded-4 p-5 shadow-sm my-4">
            <!-- PAGE TITLE -->
            <div class="text-start mb-4">
                <h1 class="page-title">Mobile providers</h1>
                <p class="lead text-start">
                    Compare mobile plans from all major Croatian providers in one place.
                </p>
            </div>

            <hr class="provider-divider">

            <div class="row justify-content-center">
                {% for i in range(5) %}
                <div class="col-6 col-md-4 col-lg-2 mb-4">
                    <a href="{{ url_for(paths[i]) }}" class="text-decoration-none">
                        <div class="provider-card">
                            <img src="{{ url_for('static', filename=circle_images[i]) }}" alt="{{ paths[i] }}">
                            <h5>{{ tariff_names[i] }}</h5>
                            <div class="provider-info"></div>
                        </div>
                    </a>
                </div>
                {% endfor %}
            </div>
            <div class="row justify-content-center">
                {% for i in range(5, 7) %}
                    <div class="col-6 col-md-4 col-lg-5 mb-4">
                        <a href="{{ url_for(paths[i]) }}" class="text-decoration-none">
                            <div class="provider-card">
                                <img src="{{ url_for('static', filename=circle_images[i]) }}" alt="{{ paths[i] }}">
                                <h5>{{ tariff_names[i] }}</h5>
                                <div class="provider-info"></div>
                            </div>
                        </a>
                    </div>
                {% endfor %}
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto">
        <div class="container">
            {% include 'footer.html' %}
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // FILTER LOGIC
        const checkboxes = document.querySelectorAll('.filter');
        const providers = document.querySelectorAll('.provider-card');

        checkboxes.forEach(cb => cb.addEventListener('change', () => {
            const selected = Array.from(checkboxes)
                .filter(c => c.checked)
                .map(c => c.value);

            providers.forEach(p => {
                const types = p.dataset.types.split(',');
                p.style.display = selected.every(s => types.includes(s)) || selected.length === 0 ? 'block' : 'none';
            });
        }));
    </script>
</body>
</html>
